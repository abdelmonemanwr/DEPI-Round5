<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Registration Form</h1>


    <form action="./thanks.html" method="get">
        <!-- <span>First Name:</span> -->
        <label for="fname">First Name:</label>
        <input type="text" name="fname" id="fname" />
        <br />

        <label for="pass">Password:</label>
        <input type="password" name="pass" id="pass" />
        <br />

        <label for="age">Age:</label>
        <input type="number" name="age" id="age" min="16" max="60" />
        <br />

        <label for="email">Email:</label>
        <input type="email" name="email" id="email" />
        <br />

        <label for="courses">Courses:</label>
        <select name="courses" id="courses">
            <option>HTML</option>
            <option>CSS</option>
            <option>JS</option>
        </select>
        <br />
        <label for="gender">Gender:</label>
        <input type="radio" value="0" name="gender" /> <span>Male</span>
        <input type="radio" value="1" name="gender" /> <span>Female</span>

        <br />

        <label for="message">Message:</label>
        <textarea name="message" id="message" cols="10" rows="3"></textarea>

        <br />

        <main>

        </main>

        <audio src="audio.mp3"></audio>

        <video src="video.mp4" controls></video>



        <section></section>

        <input type="submit" value="Submit" />
    </form>


</body>

</html>
